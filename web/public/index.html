<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmileShark Todo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, 'Segoe UI', sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
    }

    /* ── Auth overlay ── */
    .auth-overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #0077b6, #00b4d8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .auth-card {
      background: white;
      border-radius: 20px;
      padding: 36px 32px 32px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
    }

    .auth-brand {
      text-align: center;
      margin-bottom: 24px;
    }

    .auth-brand .shark { font-size: 2.4rem; display: block; margin-bottom: 6px; }
    .auth-brand h2 { font-size: 1.3rem; font-weight: 700; color: #1e293b; }
    .auth-brand p { font-size: 0.8rem; color: #94a3b8; margin-top: 3px; }

    .auth-tabs {
      display: flex;
      border-radius: 10px;
      background: #f1f5f9;
      padding: 4px;
      margin-bottom: 20px;
      gap: 4px;
    }

    .auth-tab {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 7px;
      background: transparent;
      font-size: 0.9rem;
      font-weight: 500;
      color: #64748b;
      cursor: pointer;
      transition: all 0.2s;
    }

    .auth-tab.active {
      background: white;
      color: #0077b6;
      font-weight: 600;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
    }

    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .auth-form input {
      padding: 11px 14px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .auth-form input:focus { border-color: #00b4d8; }

    .auth-form button {
      padding: 12px;
      background: linear-gradient(135deg, #0077b6, #00b4d8);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      margin-top: 4px;
    }

    .auth-form button:hover { opacity: 0.9; }
    .auth-form button:active { transform: scale(0.98); }

    .auth-error {
      background: #fef2f2;
      color: #dc2626;
      border: 1px solid #fecaca;
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 0.85rem;
      margin-bottom: 12px;
    }

    /* ── App ── */
    header {
      background: linear-gradient(135deg, #0077b6, #00b4d8);
      color: white;
      padding: 28px 24px 20px;
      box-shadow: 0 4px 12px rgba(0, 119, 182, 0.3);
    }

    .header-top {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }

    .header-top h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.3px; }

    .header-sub {
      font-size: 0.82rem;
      opacity: 0.85;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logout-btn {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 6px;
      padding: 4px 12px;
      font-size: 0.78rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .logout-btn:hover { background: rgba(255, 255, 255, 0.3); }

    .container {
      max-width: 580px;
      margin: 0 auto;
      padding: 24px 16px;
    }

    .card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.07);
      overflow: hidden;
    }

    .add-section {
      padding: 16px;
      border-bottom: 1px solid #e8f4f8;
    }

    #add-form { display: flex; gap: 8px; }

    #new-todo {
      flex: 1;
      padding: 10px 14px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      font-size: 0.95rem;
      transition: border-color 0.2s;
      outline: none;
    }

    #new-todo:focus { border-color: #00b4d8; }

    #add-form button {
      padding: 10px 18px;
      background: linear-gradient(135deg, #0077b6, #00b4d8);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      white-space: nowrap;
    }

    #add-form button:hover { opacity: 0.9; }
    #add-form button:active { transform: scale(0.97); }

    .stats-bar {
      padding: 10px 16px;
      background: #f8fcff;
      border-bottom: 1px solid #e8f4f8;
      font-size: 0.82rem;
      color: #64748b;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stats-bar .count { font-weight: 700; color: #0077b6; }

    .progress-bar {
      flex: 1;
      height: 5px;
      background: #e2e8f0;
      border-radius: 99px;
      overflow: hidden;
      margin-left: 8px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #0077b6, #00b4d8);
      border-radius: 99px;
      transition: width 0.4s ease;
    }

    #todo-list { list-style: none; min-height: 60px; }

    #todo-list li {
      padding: 14px 16px;
      border-bottom: 1px solid #f1f5f9;
      display: flex;
      align-items: center;
      gap: 12px;
      animation: slideIn 0.25s ease;
      transition: background 0.15s;
    }

    #todo-list li:last-child { border-bottom: none; }
    #todo-list li:hover { background: #f8fcff; }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeOut {
      from { opacity: 1; transform: translateX(0); }
      to   { opacity: 0; transform: translateX(20px); }
    }

    .todo-check {
      width: 20px;
      height: 20px;
      accent-color: #00b4d8;
      cursor: pointer;
      flex-shrink: 0;
    }

    .todo-title {
      flex: 1;
      font-size: 0.95rem;
      color: #1e293b;
      word-break: break-all;
      transition: color 0.2s;
    }

    li.done .todo-title { text-decoration: line-through; color: #94a3b8; }

    .del-btn {
      padding: 4px 10px;
      background: transparent;
      color: #cbd5e1;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      font-size: 0.78rem;
      cursor: pointer;
      transition: all 0.15s;
      flex-shrink: 0;
    }

    .del-btn:hover { background: #fee2e2; color: #ef4444; border-color: #fca5a5; }

    .empty-state { padding: 48px 24px; text-align: center; color: #94a3b8; }
    .empty-state .shark {
      font-size: 3rem;
      display: block;
      margin-bottom: 12px;
      animation: bounce 1.8s ease-in-out infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-8px); }
    }

    .empty-state p { font-size: 0.95rem; line-height: 1.6; }
    .empty-state .hint { font-size: 0.8rem; margin-top: 6px; color: #b0bec5; }
  </style>
</head>
<body>

<!-- 인증 화면 -->
<div id="auth-overlay" class="auth-overlay">
  <div class="auth-card">
    <div class="auth-brand">
      <span class="shark">🦈</span>
      <h2>SmileShark Todo</h2>
      <p>로그인하여 할 일을 관리하세요</p>
    </div>

    <button onclick="login()" style="width:100%;padding:13px;background:linear-gradient(135deg,#0077b6,#00b4d8);color:#fff;border:none;border-radius:10px;font-size:0.98rem;font-weight:600;cursor:pointer;">로그인 / 회원가입</button>
  </div>
</div>

<!-- 메인 앱 -->
<div id="app" style="display:none">
  <header>
    <div class="header-top">
      <span style="font-size:1.5rem">🦈</span>
      <h1>SmileShark Todo</h1>
    </div>
    <div class="header-sub">
      <span id="datetime"></span>
      <div style="display:flex;align-items:center;gap:10px">
        <span id="welcome-user" style="opacity:0.9"></span>
        <button class="logout-btn" onclick="logout()">로그아웃</button>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="card">
      <div class="add-section">
        <form id="add-form">
          <input id="new-todo" placeholder="오늘 할 일을 입력하세요" required>
          <button type="submit">+ 추가</button>
        </form>
      </div>

      <div class="stats-bar">
        <span id="stats-text">불러오는 중...</span>
        <div class="progress-bar">
          <div class="progress-fill" id="progress-fill" style="width:0%"></div>
        </div>
      </div>

      <ul id="todo-list"></ul>
    </div>
  </div>
</div>

<script>
  // ── Cognito 설정 ──
  const COGNITO = {
    domain: 'https://ap-northeast-2q1k9fluel.auth.ap-northeast-2.amazoncognito.com',
    clientId: '2k8ltduq6m6n5eq01kcsaib48b',
    redirectUri: window.location.origin + '/todoapp/',
    scope: 'openid email'
  };

  // ── PKCE 헬퍼 ──
  function base64url(bytes) {
    return btoa(String.fromCharCode(...bytes)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  function randomString(len) {
    const arr = new Uint8Array(len);
    crypto.getRandomValues(arr);
    return base64url(arr);
  }
  async function sha256(str) {
    return new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str)));
  }

  // ── 토큰 ──
  function getToken() { return localStorage.getItem('access_token'); }
  function getUsername() {
    const idt = localStorage.getItem('id_token');
    if (!idt) return '사용자';
    try { return JSON.parse(atob(idt.split('.')[1])).email || '사용자'; } catch { return '사용자'; }
  }

  // 로그인: Cognito Hosted UI로 리다이렉트 (Authorization Code + PKCE)
  async function login() {
    const verifier = randomString(64);
    sessionStorage.setItem('pkce_verifier', verifier);
    const challenge = base64url(await sha256(verifier));
    window.location.href = `${COGNITO.domain}/oauth2/authorize?response_type=code`
      + `&client_id=${COGNITO.clientId}`
      + `&redirect_uri=${encodeURIComponent(COGNITO.redirectUri)}`
      + `&scope=${encodeURIComponent(COGNITO.scope)}`
      + `&code_challenge=${challenge}&code_challenge_method=S256`;
  }

  // 콜백: 인가 코드를 토큰으로 교환
  async function handleCallback() {
    const code = new URLSearchParams(window.location.search).get('code');
    if (!code) return false;
    const verifier = sessionStorage.getItem('pkce_verifier');
    if (!verifier) return false;
    const res = await fetch(`${COGNITO.domain}/oauth2/token`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({
        grant_type: 'authorization_code',
        client_id: COGNITO.clientId,
        code,
        redirect_uri: COGNITO.redirectUri,
        code_verifier: verifier
      })
    });
    sessionStorage.removeItem('pkce_verifier');
    if (!res.ok) return false;
    const t = await res.json();
    localStorage.setItem('access_token', t.access_token);
    localStorage.setItem('id_token', t.id_token);
    if (t.refresh_token) localStorage.setItem('refresh_token', t.refresh_token);
    window.history.replaceState({}, '', COGNITO.redirectUri);
    return true;
  }

  // 로그아웃: 토큰 삭제 + Cognito 세션 종료
  function logout() {
    localStorage.removeItem('access_token');
    localStorage.removeItem('id_token');
    localStorage.removeItem('refresh_token');
    window.location.href = `${COGNITO.domain}/logout?client_id=${COGNITO.clientId}`
      + `&logout_uri=${encodeURIComponent(COGNITO.redirectUri)}`;
  }

  function showLogin() {
    document.getElementById('app').style.display = 'none';
    document.getElementById('auth-overlay').style.display = 'flex';
  }

  function showApp() {
    document.getElementById('auth-overlay').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('welcome-user').textContent = getUsername() + '님';
    loadTodos();
  }

  // API 요청에 토큰 자동 첨부, 401 시 로그인 화면으로
  async function apiFetch(url, options = {}) {
    const res = await fetch(url, {
      ...options,
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${getToken()}`,
        ...(options.headers || {})
      }
    });
    if (res.status === 401) {
      localStorage.removeItem('access_token');
      localStorage.removeItem('id_token');
      showLogin();
      return null;
    }
    return res;
  }

  // ── Todo logic ──
  const API = '/todoapp/api/todos';

  function updateDatetime() {
    const now = new Date();
    const opts = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short', hour: '2-digit', minute: '2-digit' };
    document.getElementById('datetime').textContent = now.toLocaleString('ko-KR', opts);
  }

  function updateStats(todos) {
    const total = todos.length;
    const done  = todos.filter(t => t.done).length;
    const pct   = total > 0 ? Math.round(done / total * 100) : 0;
    document.getElementById('stats-text').innerHTML =
      `완료 <span class="count">${done}</span> / ${total}개 &nbsp;·&nbsp; ${pct}%`;
    document.getElementById('progress-fill').style.width = pct + '%';
  }

  async function loadTodos() {
    const res = await apiFetch(API);
    if (!res) return;
    const todos = await res.json();
    const list  = document.getElementById('todo-list');
    list.innerHTML = '';

    if (todos.length === 0) {
      list.innerHTML = `
        <div class="empty-state">
          <span class="shark">🦈</span>
          <p>할 일이 없어요!<br>위에서 새 할 일을 추가해보세요.</p>
          <p class="hint">SmileShark가 응원합니다 🎉</p>
        </div>`;
      updateStats([]);
      return;
    }

    todos.forEach(t => {
      const li = document.createElement('li');
      li.className = t.done ? 'done' : '';
      li.dataset.id = t.id;
      li.innerHTML = `
        <input class="todo-check" type="checkbox" ${t.done ? 'checked' : ''}
               onchange="toggle(${t.id}, this.checked)">
        <span class="todo-title">${escHtml(t.title)}</span>
        <button class="del-btn" onclick="del(${t.id}, this)">삭제</button>
      `;
      list.appendChild(li);
    });

    updateStats(todos);
  }

  document.getElementById('add-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const input = document.getElementById('new-todo');
    const title = input.value.trim();
    if (!title) return;
    await apiFetch(API, {
      method: 'POST',
      body: JSON.stringify({ title })
    });
    input.value = '';
    loadTodos();
  });

  async function toggle(id, done) {
    await apiFetch(`${API}/${id}`, {
      method: 'PUT',
      body: JSON.stringify({ done })
    });
    loadTodos();
  }

  async function del(id, btn) {
    const li = btn.closest('li');
    li.style.animation = 'fadeOut 0.2s ease forwards';
    await new Promise(r => setTimeout(r, 180));
    await apiFetch(`${API}/${id}`, { method: 'DELETE' });
    loadTodos();
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Init ──
  updateDatetime();
  setInterval(updateDatetime, 10000);

  (async () => {
    if (window.location.search.includes('code=')) {
      if (await handleCallback()) { showApp(); return; }
    }
    if (getToken()) showApp();
    else showLogin();
  })();
</script>
</body>
</html>
